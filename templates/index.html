<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div id="welcome-message" class="alert alert-light text-center">
            <h4>👋 ¡Welcome to Currency Converter!</h4>
            <p>Enter an amount and select a currency to see the conversion.</p>
        </div>

        <div id="popular-rates" class="text-center mt-3">
            <h5>Current Exchange Rates</h5>
            <p><strong>USD → EUR:</strong> <span id="usd-eur-rate">Loading...</span></p>
            <p><strong>USD → GBP:</strong> <span id="usd-gbp-rate">Loading...</span></p>
            <p><strong>USD → COP:</strong> <span id="usd-cop-rate">Loading...</span></p>
        </div>

        <form id="currency-form" class="mt-3">
            <div class="row">
                <div class="col-md-4">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" id="amount" name="amount" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-4">
                    <label for="from_currency" class="form-label">From</label>
                    <input list="currencies-list" id="from_currency" name="from_currency" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="to_currency" class="form-label">To</label>
                    <input list="currencies-list" id="to_currency" name="to_currency" class="form-control" required>
                </div>
            </div>
            <datalist id="currencies-list">
                {% for currency in currencies %}
                    <option value="{{ currency }}">
                {% endfor %}
            </datalist>

            <button type="submit" class="btn btn-dark w-100 mt-3">Convert</button>

            <div id="loading" class="text-center mt-3" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Procesing conversion...</p>
            </div>
        </form>

        <div id="result" class="result-box mt-3" style="display: none;"></div>

        <div id="history-section" class="mt-4" style="display: none; opacity: 0; transition: opacity 0.5s ease-in-out;">
            <h4 class="text-center">Exchange Rate History</h4>
            <div class="chart-container" style="position: relative; height: 350px; width: 100%;">
                <canvas id="exchangeChart"></canvas>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
